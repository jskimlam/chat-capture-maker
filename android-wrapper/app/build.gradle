plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jskimlam.chatcapturemaker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jskimlam.chatcapturemaker.mobile'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
