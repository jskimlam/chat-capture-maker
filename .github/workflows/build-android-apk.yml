name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chat-capture-maker-debug-keystore-v1

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Build debug APK
        run: gradle -p android-wrapper --no-daemon assembleDebug

      - name: Prepare APK artifact
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk Chat-Capture-Maker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chat-Capture-Maker-APK
          path: Chat-Capture-Maker.apk
          if-no-files-found: error
